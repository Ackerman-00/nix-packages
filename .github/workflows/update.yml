name: Packages Auto-Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-flake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v22
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes fetch-closure

      - name: Update Packages
        run: |
          set -euo pipefail
          UPDATED=0

          # RootApp Update
          ROOT_OLD_HASH=$(grep -oP 'hash = "\K[^"]+' pkgs/rootapp.nix)
          ROOT_RAW=$(nix store prefetch-file --refresh https://installer.rootapp.com/installer/Linux/X64/Root.AppImage --json 2>&1)
          ROOT_NEW_HASH=$(echo "$ROOT_RAW" | jq -r .hash)

          if [ -z "$ROOT_NEW_HASH" ] || [ "$ROOT_NEW_HASH" = "null" ]; then
            echo "ERROR: Failed to fetch rootapp hash. Raw output: $ROOT_RAW"
            exit 1
          fi

          if [ "$ROOT_OLD_HASH" != "$ROOT_NEW_HASH" ]; then
            sed -i '/url = "https:\/\/installer.rootapp.com\/installer\/Linux\/X64\/Root.AppImage"/,/hash =/ s|hash = ".*"|hash = "'"$ROOT_NEW_HASH"'"|' pkgs/rootapp.nix
            UPDATED=1
          else
            echo "RootApp: no change (hash: $ROOT_NEW_HASH)"
          fi

          # Opencode Desktop Update
          OPEN_OLD_VER=$(grep -oP 'version = "\K[^"]+' pkgs/opencode-desktop.nix)
          OPEN_NEW_VER=$(curl -sL https://api.github.com/repos/anomalyco/opencode/releases/latest | jq -r .tag_name)

          if [ -z "$OPEN_NEW_VER" ] || [ "$OPEN_NEW_VER" = "null" ]; then
            echo "ERROR: Failed to fetch opencode version"
            exit 1
          fi

          if [ "$OPEN_OLD_VER" != "$OPEN_NEW_VER" ]; then
            OPEN_NEW_URL="https://github.com/anomalyco/opencode/releases/download/${OPEN_NEW_VER}/opencode-desktop-linux-amd64.deb"
            OPEN_RAW=$(nix store prefetch-file --refresh "$OPEN_NEW_URL" --json 2>&1)
            OPEN_NEW_HASH=$(echo "$OPEN_RAW" | jq -r .hash)

            if [ -z "$OPEN_NEW_HASH" ] || [ "$OPEN_NEW_HASH" = "null" ]; then
              echo "ERROR: Failed to fetch opencode hash. Raw output: $OPEN_RAW"
              exit 1
            fi

            sed -i 's|version = ".*"|version = "'"$OPEN_NEW_VER"'"|' pkgs/opencode-desktop.nix
            sed -i '/url = "https:\/\/github.com\/anomalyco\/opencode\/releases\/download/,/hash =/ s|hash = ".*"|hash = "'"$OPEN_NEW_HASH"'"|' pkgs/opencode-desktop.nix
            UPDATED=1
          fi

          # Commit
          if [ "$UPDATED" -eq 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add pkgs/rootapp.nix pkgs/opencode-desktop.nix
            git commit -m "chore: auto-update packages"
            git push
          fi
