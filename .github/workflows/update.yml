name: Packages Auto-Update

on:
  schedule:
    - cron: '0 */6 * * *'   # Every 6 hours (opencode-schedule follows 10 min later at :10)
  workflow_dispatch:

jobs:
  update-flake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes fetch-closure

      - name: Upgrade Nix to latest stable (never hardcode a version pin)
        run: sudo -i nix upgrade-nix

      - name: Install nix-update
        run: nix profile install nixpkgs#nix-update

      - name: Magic Nix Cache (CI speed, free)
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Update Packages
        run: |
          set -euo pipefail
          UPDATED=0

          # ---- RootApp: refresh hash only (no version in URL to detect) ----
          ROOT_X64_URL="https://installer.rootapp.com/installer/Linux/X64/Root.AppImage"
          ROOT_ARM_URL="https://installer.rootapp.com/installer/Linux/Arm64/Root.AppImage"
          ROOT_X64_OLD=$(grep -A1 'X64/Root.AppImage' pkgs/rootapp.nix | grep -oP 'hash = "\K[^"]+' || true)
          ROOT_ARM_OLD=$(grep -A1 'Arm64/Root.AppImage' pkgs/rootapp.nix | grep -oP 'hash = "\K[^"]+' || true)
          ROOT_X64_NEW=$(nix store prefetch-file --refresh "$ROOT_X64_URL" --json 2>/dev/null | jq -r .hash || echo "")
          ROOT_ARM_NEW=$(nix store prefetch-file --refresh "$ROOT_ARM_URL" --json 2>/dev/null | jq -r .hash || echo "")
          if [ -n "$ROOT_X64_NEW" ] && [ "$ROOT_X64_NEW" != "null" ] && [ "$ROOT_X64_OLD" != "$ROOT_X64_NEW" ]; then
            sed -i '/X64\/Root.AppImage/,/hash =/ s|hash = ".*"|hash = "'"$ROOT_X64_NEW"'"|' pkgs/rootapp.nix
            UPDATED=1
            echo "rootapp: x86_64 hash refreshed"
          fi
          if [ -n "$ROOT_ARM_NEW" ] && [ "$ROOT_ARM_NEW" != "null" ] && [ "$ROOT_ARM_OLD" != "$ROOT_ARM_NEW" ]; then
            sed -i '/Arm64\/Root.AppImage/,/hash =/ s|hash = ".*"|hash = "'"$ROOT_ARM_NEW"'"|' pkgs/rootapp.nix
            UPDATED=1
            echo "rootapp: aarch64 hash refreshed"
          fi

          # ---- All other packages ----
          # Primary: nix-update (handles tags/releases across GitHub/GitLab/
          # codeberg/pypi/...). Fallback: generic -git mode for ANY package
          # dropped into pkgs/ whose upstream has no tags/releases -> track
          # main HEAD as base-version^gitdategitshortcommit (fetchFromGitHub
          # files with rev = <40-hex>), bumping rev + hash + version together.
          git_mode_update() {
            local f="pkgs/$1.nix"
            local O R REV HEAD SHORT GITDATE CURVER NEWHASH BASE NV
            O=$(grep -oP 'owner = "\K[^"]+' "$f" | head -1 || true)
            R=$(grep -oP 'repo = "\K[^"]+' "$f" | head -1 || true)
            REV=$(grep -oP 'rev = "\K[0-9a-f]{40}' "$f" | head -1 || true)
            [ -n "$O" ] && [ -n "$R" ] && [ -n "$REV" ] || { echo "  $1: not a fetchFromGitHub rev-pinned pkg; skip"; return 0; }
            HEAD=$(git ls-remote "https://github.com/$O/$R.git" HEAD 2>/dev/null | awk '{print $1}')
            [ -n "$HEAD" ] || { echo "  WARN: $1 ls-remote failed"; return 0; }
            if [ "$HEAD" = "$REV" ]; then
              echo "  $1: already at HEAD (${HEAD:0:7})"
              return 0
            fi
            SHORT=${HEAD:0:7}
            GITDATE=$(curl -sL ${GITHUB_TOKEN:+-H "Authorization: token $GITHUB_TOKEN"} \
              "https://api.github.com/repos/$O/$R/commits/$HEAD" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('commit',{}).get('committer',{}).get('date',''))" 2>/dev/null \
              | tr -d '\-TZ:')
            [ -n "$GITDATE" ] || GITDATE=$(date -u +%Y%m%d%H%M%S)
            CURVER=$(grep -oP '^\s*version = "\K[^"]+' "$f" | head -1 || true)
            BASE=${CURVER%%^*}
            NV="${BASE}^${GITDATE}git${SHORT}"
            NEWHASH=$(nix flake prefetch --json "github:$O/$R/$HEAD" 2>/dev/null | jq -r .hash)
            if [ -z "$NEWHASH" ] || [ "$NEWHASH" = "null" ]; then
              echo "  WARN: $1 skipped (prefetch failed)"
              return 0
            fi
            sed -i "/rev = /s|$REV|$HEAD|" "$f"
            sed -i "0,/hash = \"sha256-/s|hash = \"[^\"]*\"|hash = \"$NEWHASH\"|" "$f"
            sed -i -E "s|^([[:space:]]*)version = \"[^\"]*\"|\1version = \"$NV\"|" "$f"
            UPDATED=1
            echo "  $1: ${REV:0:7} -> $SHORT ($NV)"
          }

          # ---- Rust overlay packages (rev-pinned source builds) ----
          # niri-unstable + xwayland-satellite-unstable track upstream HEAD.
          # nix-update cannot do these (no tags consumed + cargoHash must be
          # refreshed per rev). rust_rev_update does all of it IN CI and
          # build-gates: a rev that doesn't compile is reverted, never pushed.
          rust_rev_update() {
            local f="pkgs/$1.nix" O="$2" R="$3"
            local CUR HEAD OUT SRCHASH GOT DATE SHORT
            CUR=$(grep -oP 'rev = "\K[0-9a-f]{40}' "$f" | head -1 || true)
            HEAD=$(git ls-remote "https://github.com/$O/$R.git" HEAD 2>/dev/null | awk '{print $1}')
            [ -n "$HEAD" ] || { echo "  WARN: $1 ls-remote failed"; return 0; }
            if [ "$HEAD" = "$CUR" ] && ! grep -q "fakeHash" "$f"; then
              echo "  $1: already at HEAD (${HEAD:0:12})"
              return 0
            fi
            echo "  $1: ${CUR:0:12} -> ${HEAD:0:12}"
            # 1. fresh src tree hash (fetchGit NAR hash = what fetchFromGitHub wants)
            OUT=$(nix eval --impure --json --expr "builtins.fetchGit { url = \"https://github.com/$O/$R\"; rev = \"$HEAD\"; }" 2>/dev/null | jq -r .outPath || true)
            [ -n "$OUT" ] || { echo "  WARN: $1 fetchGit failed"; return 0; }
            SRCHASH=$(nix path-info --json --json-format 1 "$OUT" 2>/dev/null | jq -r '.[].narHash' || true)
            [ -n "$SRCHASH" ] && [ "$SRCHASH" != "null" ] || { echo "  WARN: $1 narHash failed"; return 0; }
            python3 - "$f" "$CUR" "$HEAD" "$SRCHASH" <<'PYEOF'
          import re, sys
          path, cur, head, srchash = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
          text = open(path).read()
          if cur:
              text = text.replace(cur, head)
          # replace ONLY the src hash: first hash="sha256-..." after the rev line
          m = re.search(r'(rev = "[0-9a-f]{40}"[^;]*?hash = ")sha256-[^"]+(")', text, re.S)
          if not m:
              m = re.search(r'(rev = "[0-9a-f]{40}".{0,400}?hash = ")([^"]*)(")', text, re.S)
          assert m, "src hash anchor not found"
          text = text[:m.start()] + m.group(1) + srchash + m.group(3) + text[m.end():]
          open(path, "w").write(text)
          print("  src hash refreshed")
          PYEOF
            # 2. cargoHash via the standard error trick (never guessed)
            sed -i 's|cargoHash = "sha256-[^"]*"|cargoHash = ""|; s|cargoHash = lib.fakeHash|cargoHash = ""|' "$f"
            GOT=$(nix build ".#packages.x86_64-linux.$1" --print-out-paths 2>&1 | grep -oP 'got:\s*\Ksha256-[A-Za-z0-9+/=]+' | head -1 || true)
            if [ -z "$GOT" ]; then
              echo "  WARN: $1 no cargoHash captured (build may have failed early) - reverting file"
              git checkout -- "$f"
              return 0
            fi
            sed -i "s|cargoHash = \"\"|cargoHash = \"$GOT\"|" "$f"
            # 3. version stamp + NIRI_BUILD_COMMIT (niri only)
            DATE=$(date -u +%F); SHORT=${HEAD:0:7}
            sed -i -E "s|^(\\s*)version = \"0-unstable-[^\"]*\"|\\1version = \"0-unstable-$DATE\"|" "$f"
            if [ "$1" = "niri-unstable" ]; then
              sed -i "s|NIRI_BUILD_COMMIT = \"[0-9a-f]*\"|NIRI_BUILD_COMMIT = \"$SHORT\"|" "$f"
            fi
            # 4. BUILD GATE: full compile must exit 0 or the bump is reverted
            if nix build ".#packages.x86_64-linux.$1" --print-out-paths >/dev/null 2>&1; then
              UPDATED=1
              echo "  $1: bumped + BUILD GATE PASS"
            else
              echo "  WARN: $1 new rev does not compile - reverting (last-good pin holds)"
              git checkout -- "$f"
            fi
          }

          for f in pkgs/*.nix; do
            name=$(basename "$f" .nix)
            # rootapp handled above (raw URL, no version to detect)
            [ "$name" = "rootapp" ] && continue

            # Rust overlay pins go STRAIGHT to rust_rev_update (rev + src
            # hash + cargoHash + build gate, all in CI)
            if [ "$name" = "niri-unstable" ]; then
              echo ">>> rust-rev niri-unstable (niri-wm/niri HEAD)"
              rust_rev_update "$name" "niri-wm" "niri"
              continue
            fi
            if [ "$name" = "xwayland-satellite-unstable" ]; then
              echo ">>> rust-rev xwayland-satellite-unstable (Supreeeme HEAD)"
              rust_rev_update "$name" "Supreeeme" "xwayland-satellite"
              continue
            fi

            # Pre-route tagless upstreams STRAIGHT to -git mode: running
            # nix-update against them only produces a VersionError traceback
            # (releases.atom carries no entries). GitHub releases always
            # create a tag, so "no refs/tags/" == nothing for nix-update.
            O=$(grep -oP 'owner = "\K[^"]+' "$f" | head -1 || true)
            R=$(grep -oP 'repo = "\K[^"]+' "$f" | head -1 || true)
            if [ -n "$O" ] && [ -n "$R" ] \
               && grep -qP 'rev = "[0-9a-f]{40}"' "$f" \
               && ! git ls-remote --tags "https://github.com/$O/$R.git" 2>/dev/null | grep -q 'refs/tags/'; then
              echo ">>> $name (tagless upstream -> -git mode)"
              git_mode_update "$name"
              continue
            fi

            # Fast-path: for GitHub-releases packages, compare the atom feed
            # top tag against the pinned version BEFORE paying for a full
            # flake eval inside nix-update. Equality means nix-update would
            # no-op ("already X") - skip it. Anything else falls through to
            # nix-update (the authority). Never skip on fetch failure.
            if [ -n "$O" ] && [ -n "$R" ]; then
              CURV=$(grep -oP '^\s*version = "\K[^"]+' "$f" | head -1 || true)
              ATOMTAG=$(curl -sL --max-time 20 "https://github.com/$O/$R/releases.atom" 2>/dev/null | grep -oP '<title>\Kv[^<]*|(?<=<title>)[^<]*' | head -2 | tail -1 | tr -d ' \t\n\r' || true)
              ATOMVER=${ATOMTAG#v}
              if [ -n "$CURV" ] && [ -n "$ATOMVER" ] && [ "$CURV" = "$ATOMVER" ]; then
                echo ">>> $name ($CURV == atom $ATOMTAG, skipping nix-update eval)"
                continue
              fi
            fi

            echo ">>> nix-update $name"
            # NOTE: --build is a boolean flag in nix-update; '--build=false'
            # errors with "ignored explicit argument 'false'". Default already
            # does NOT build (eval-only), which is what we want here.
            if nix-update "$name" --flake 2>&1; then
              UPDATED=1
              echo "  $name: done"
            else
              echo "  nix-update failed for $name -> trying -git mode"
              git_mode_update "$name"
            fi
          done

          # ---- Multi-arch hash safety net ----
          # nix-update only rewrites the hash of the src it evaluates; in an
          # archives.${system} attrset the other architecture keeps its STALE
          # hash after a version bump (shipped broken builds twice: helium
          # 0.15.7.1, opencode-desktop 1.18.23). Re-prefetch EVERY url/hash
          # pair in every package and fix any hash that no longer matches.
          HASHFIXES=$(python3 - <<'PYEOF'
          import json, pathlib, re, subprocess

          for path in sorted(pathlib.Path("pkgs").glob("*.nix")):
              text = path.read_text()
              pm = re.search(r'pname = "([^"]+)"', text)
              vm = re.search(r'^\s*version = "([^"]+)"', text, re.M)
              subs = {}
              if pm: subs["${pname}"] = pm.group(1)
              if vm: subs["${version}"] = vm.group(1)
              lines = text.splitlines(keepends=True)
              i = 0
              changed = False
              while i < len(lines):
                  um = re.search(r'url\s*=\s*"([^"]+)"', lines[i])
                  if not um:
                      i += 1
                      continue
                  raw_url = um.group(1)
                  j = i + 1
                  hm = None
                  while j < len(lines) and j <= i + 4:
                      hm = re.search(r'hash\s*=\s*"([^"]+)"', lines[j])
                      if hm:
                          break
                      j += 1
                  if not hm or "${" in raw_url.replace("${version}", "").replace("${pname}", ""):
                      i += 1
                      continue
                  url = raw_url
                  for k, v in subs.items():
                      url = url.replace(k, v)
                  r = subprocess.run(
                      ["nix", "store", "prefetch-file", "--refresh", url, "--json"],
                      capture_output=True, text=True,
                  )
                  if r.returncode != 0:
                      print(f"WARN prefetch failed: {url}", flush=True)
                      i += 1
                      continue
                  new_hash = json.loads(r.stdout)["hash"]
                  old_hash = hm.group(1)
                  if new_hash != old_hash:
                      lines[j] = lines[j].replace(f'hash = "{old_hash}"', f'hash = "{new_hash}"')
                      changed = True
                      print(f"HASHFIXED {path}: {url}", flush=True)
                      print(f"  {old_hash} -> {new_hash}", flush=True)
                  i = j + 1
              if changed:
                  path.write_text("".join(lines))
          PYEOF
          )
          echo "$HASHFIXES"
          if echo "$HASHFIXES" | grep -q '^HASHFIXED'; then
            UPDATED=1
            echo "::warning::stale multi-arch hash(es) repaired - see log above"
          fi

          # Commit (only if something changed; exit non-zero if any package failed so the run is red)
          if [ "$UPDATED" -eq 1 ]; then
            git config user.name "opencode-agent[bot]"
            git config user.email "41898282+opencode-agent[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: auto-update packages" || true
            git push
          fi

      - name: Dispatch binary build relay (head)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Nix-native needs-build check (no template parsing): evaluate each
          # rev-pinned output path and probe its narinfo on the rolling tag.
          # Missing = dispatch the relay with the full queue; each run builds
          # ONE package then relays, so no run can hit the 6h limit twice.
          NEEDS=""
          for pkg in niri-unstable xwayland-satellite-unstable; do
            OUT=$(nix eval --raw ".#packages.x86_64-linux.$pkg.outPath" 2>/dev/null || true)
            h=$(basename "$OUT" | cut -d- -f1)
            if [ -z "$h" ]; then
              echo "  $pkg: eval failed, queuing anyway"
              NEEDS="$NEEDS $pkg"
            elif curl -sfI --max-time 15 "https://github.com/${{ github.repository }}/releases/download/nixcache/$h.narinfo" >/dev/null 2>&1; then
              echo "  $pkg: binary published, skipping"
            else
              echo "  $pkg: binary missing, queuing"
              NEEDS="$NEEDS $pkg"
            fi
          done
          NEEDS=$(echo "$NEEDS" | xargs)
          if [ -n "$NEEDS" ]; then
            echo "dispatching relay: $NEEDS"
            # Dispatch endpoint throws transient 5xx (GitHub-side, seen
            # 2026-05/09). Retry with backoff; if all fail, warn LOUDLY but
            # don't red the updater (the update itself succeeded - next cycle
            # re-discovers the gap and retries the dispatch).
            ok=0
            for i in 1 2 3 4; do
              if gh workflow run "nixcache.yml" \
                --ref "${GITHUB_REF_NAME}" \
                --repo "${{ github.repository }}" \
                -f packages="$NEEDS" \
                -f force_rebuild="false"; then
                ok=1
                break
              fi
              echo "::warning::dispatch attempt $i/4 failed - backing off"
              sleep $((30 * i))
            done
            [ "$ok" -eq 1 ] || echo "::warning::relay dispatch failed after 4 tries - binaries stay missing until next cycle re-dispatches"
          else
            echo "all binaries published, no relay needed."
          fi
