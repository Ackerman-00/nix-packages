name: opencode-schedule

on:
  schedule:
    - cron: '0 0 2,5,8,11,14,17,20,23,26,29 * *'       # 36h cycle: runs at 00:00 on days ≡2 (mod 3)
    - cron: '0 12 3,6,9,12,15,18,21,24,27,30 * *'      # and 12:00 on days ≡0 (mod 3) - NEVER at the
                                                       # same 12h slot as check-updates or official-update
  workflow_dispatch:
    inputs:
      relay:
        description: 'Relay continuation run - pick up unfinished work from .opencode-relay.md'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  id-token: write

concurrency:
  group: opencode-schedule
  cancel-in-progress: false

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Configure git auth for pushes
        run: |
          git config --global user.name "opencode-agent[bot]"
          git config --global user.email "41898282+opencode-agent[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install opencode (latest)
        shell: bash
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Run opencode
        shell: bash
        run: |
          export PATH="$HOME/.opencode/bin:$PATH"
          # raw.githubusercontent.com serves CDN-stale content (~5min max-age=300) after a
          # push, and its CDN ignores cache-busting query params. Read the relay via the
          # git protocol first, then the GitHub API; never via raw.githubusercontent.com.
          gate_passes() {
            git fetch -q origin +refs/heads/main:refs/remotes/origin/main >/dev/null 2>&1 || true
            local content=""
            content="$(git show origin/main:.opencode-relay.md 2>/dev/null || true)"
            if [ -z "$content" ]; then
              content="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.opencode-relay.md?ref=main" --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || true)"
            fi
            printf '%s' "$content" | grep -qx "run_id: $RUN_ID" && printf '%s' "$content" | grep -qi "status: complete" && printf '%s' "$content" | grep -qi "PACKAGE.*BR\|deps-verified\|dependency audit"
          }
          for model in "opencode/x-preview-f-free" "opencode/muse-spark-1.2-contributor-free" "opencode/mimo-v2.5-free" "opencode/hy3-free" "opencode/nemotron-3-ultra-free" "opencode/nemotron-3.5-lightning-free" "opencode/big-pickle"; do
            echo "=== opencode run attempt with $model ==="
            exit_code=0
            MODEL="$model" opencode run -m "$model" --dangerously-skip-permissions --agent=build --print-logs "$PROMPT" || exit_code=$?
            if [ "$exit_code" -eq 0 ]; then
              ok=0
              for attempt in $(seq 1 10); do
                if gate_passes; then
                  ok=1
                  break
                fi
                echo "=== gate attempt $attempt: relay not confirmed yet (origin/main=$(git rev-parse --short origin/main 2>/dev/null || echo missing)) - retrying ==="
                sleep 45
              done
              if [ "$ok" -eq 1 ]; then
                echo "=== $model completed the full job (.opencode-relay.md on main confirms run $RUN_ID complete) ==="
                exit 0
              fi
              echo "=== $model exited 0 but .opencode-relay.md on main does not confirm run $RUN_ID complete - run is INCOMPLETE, treating as failure ==="
            else
              echo "=== attempt with $model failed (exit $exit_code) - trying next ==="
            fi
            sleep 15
          done
          exit 1
        env:
          MODEL: opencode/x-preview-f-free
          OPENCODE_CONFIG_CONTENT: '{"small_model":"opencode/x-preview-f-free"}'
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELAY: ${{ github.event.inputs.relay || 'false' }}
          RUN_ID: ${{ github.run_id }}
          GIT_AUTHOR_NAME: opencode-agent[bot]
          GIT_AUTHOR_EMAIL: 41898282+opencode-agent[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: opencode-agent[bot]
          GIT_COMMITTER_EMAIL: 41898282+opencode-agent[bot]@users.noreply.github.com
          PROMPT: |
            You are the FULLY AUTONOMOUS maintainer of nix-packages
            (https://github.com/Ackerman-00/nix-packages), a Nix flake providing
            binary-native packages (AppImage/.deb/tar.xz via fetchurl + patchelf/makeWrapper)
            for x86_64-linux + aarch64-linux via `github:Ackerman-00/nix-packages` flake.

            RELAY / LONG-RUN HANDOFF (MANDATORY): a run may last up to ~6 hours
            (timeout-minutes: 355). NEVER let a run die with work unfinished or
            unrecorded - hand it over to the next runner. The relay state file is
            `.opencode-relay.md` at the repo root - it is the SINGLE completion
            record, and the workflow reads it from main after your process exits:
            it must contain the exact line `run_id: $RUN_ID` (RUN_ID = the env
            var value, e.g. "run_id: 1234567890") and a terminal status. If it
            does NOT, the run is treated as FAILED. NEVER create separate
            completion files; never delete `.opencode-relay.md`.
              a. PICKUP ON START: if `.opencode-relay.md` exists on main with
                 status "unfinished", or this run was started with relay=true
                 (env RELAY=1), READ IT FIRST and continue that work FIRST.
              b. KEEP STATE CURRENT: as you work, keep `.opencode-relay.md`
                 updated. Commit + push it together with your fixes.
              c. HANDOFF TRIGGER: when the run has been going ~5-5.5 hours,
                 STOP starting new work. Finish and push everything, set
                 `.opencode-relay.md` to status "unfinished" with the precise
                 continuation plan, commit + push, then trigger the relay:
                   gh workflow run opencode-schedule.yml --ref main \
                     --repo Ackerman-00/nix-packages -f relay=true
              d. COMPLETION: when all work is done, set the relay to
                 `status: complete` and add `run_id: $RUN_ID` (the ACTUAL
                 numeric value, not the literal text) to `.opencode-relay.md`,
                 then commit + push.

            GIT IDENTITY (MANDATORY - "ONLY opencode-agent[bot], NOTHING ELSE").
            The ONLY allowed commit identity is exactly
            `opencode-agent[bot] <41898282+opencode-agent[bot]@users.noreply.github.com>`.
            NEVER run `git config user.name` / `git config user.email`.
            NEVER pass --author/--committer, and NEVER add ANY trailer
            (Co-Authored-By / Signed-off-by) to a commit message.
            NEVER invent or guess any email address.
            Always `git fetch origin && git pull --rebase origin main` before pushing.

            UNDERSTAND WHAT THIS REPO IS. It is a Nix flake (`flake.nix` + `flake.lock`)
            exposing `packages.${system}.*` via `pkgs.callPackage ./pkgs/*.nix` for
            `x86_64-linux` + `aarch64-linux`. Each package is either `fetchurl`+`mkDerivation`+`patchelf`+`makeWrapper`+`makeLibraryPath` (helium, protonplus, zen-browser) or `appimageTools.extractType2/wrapType2` (rootapp) or `fetchurl` .deb extract (opencode-desktop). Built via `nix build` / `nix run`, not `nixpkgs` PRs. Read `flake.nix`, `pkgs/*.nix`, `README.md` before touching anything.

            CONTEXT
            - Packages live as `pkgs/<name>.nix` (helium.nix, rootapp.nix, etc.) + `flake.nix` `forAllSystems` + `flake.lock` pins nixpkgs `nixos-unstable`.
            - Binary-native packages must set `meta.sourceProvenance = with lib.sourceTypes; [ binaryNativeCode ]` (pkgs/README.md), `meta.license`, `meta.description` (one sentence, capitalized, no period, factual), `meta.mainProgram`, `meta.platforms = lib.platforms.linux`, `meta.maintainers`.
            - `version` must start with digit, `fetchurl`/`fetchFromGitHub` must have SRI `sha256-...` hash (not hex), `allowUnfree = true` for proprietary (rootapp).
            - `flake.lock` pins `nixpkgs` -- `nix flake update` bumps it; only files `git add`ed are copied into store (pure evaluation).
            - Tools: `nix` (2.4+ flakes, experimental-features `nix-command flakes`), `nixpkgs-review`, `nixfmt`, `nixpkgs-hammering`, `nixos/nix` docker.

            WEB SEARCH IS YOUR PRIMARY VERIFICATION TOOL. Use `gh api` for GitHub API (NOT curl). For every package, web-search `nixpkgs <pkg>` and upstream `github.com/<owner>/<repo>/releases/latest` to confirm latest version, `url`+`hash` resolve (`curl -sI` 200 for non-GitHub distfiles, `nix-prefetch-url` or `nix hash to-sri --type sha256`), and check `repology` + `Nix User Repository` for freshness. NEVER trust a version/hash you haven't verified.
            - GITHUB API RATE LIMITS (2026 community best practice - docs.github.com/rest/using-the-rest-api/rate-limits-for-the-rest-api + dev.to 2026-08-19): unauthenticated = 60/hour (IP-shared, 304 still costs 1), GITHUB_TOKEN via `gh api` = 1000/hour per repo (Actions) / PAT = 5000/hour. NEVER use `curl https://api.github.com/...` without token -- ALWAYS use `gh api repos/<owner>/<repo>/releases/latest --jq .tag_name` with `gh api --cache 3600s`. If you must use curl for GitHub, add `-H "Authorization: token $GITHUB_TOKEN"` -- unauth 304 does NOT save quota. Prefer `gh api` and check `gh api rate_limit`.

            PACKAGE DEPENDENCY DEEP AUDIT (MANDATORY - "TEAR EVERY PACKAGE APART"; applies to every package, every run):
              a0. CHECK OFFICIAL PACKAGING FIRST (2026 advanced -- web search latest, August 2026): For `{pkg}`, first check the official distro packaging -- nixpkgs (github.com/NixOS/nixpkgs/pkgs/<category>/<pkg>/default.nix + search.nixos.org) (`git clone --depth 1 https://github.com/NixOS/nixpkgs.git /tmp/nixpkgs && find /tmp/nixpkgs/pkgs -type f -name "default.nix" -path "*/<pkg>/*"`) -- if found, read its `buildInputs`/`runtimeDeps`/`version` as the latest reference for dependencies (official is where newer default.nix land first). If official has a newer default.nix/dependencies than ours, align with it (keep our flake's `allowUnfree`/`binaryNativeCode`). If official has no default.nix for this package (404 / no file), then proceed to tear apart upstream `tar`/`deb`/`rpm`/`AppImage` in Docker as below -- download into `/tmp` (never repo tree), extract, and derive deps from inside (`ldd` `NEEDED` vs `runtimeDeps` vs `RDEPEND` etc.). Web-search 2026 for official + upstream before deciding.
              a. OPEN THE PACKAGE. Read FULL `pkgs/<pkg>.nix` (`pname`, `version`, `archives` per system, `runtimeDeps`/`buildInputs`, `nativeBuildInputs` `patchelf`/`makeWrapper`, `rpath = lib.makeLibraryPath`, `meta`). Download `fetchurl` URL into /tmp (gitignored) and EXTRACT (`tar xf`, `ar x`+`tar xf`, `unsquashfs` for AppImage). Inspect upstream files: `Cargo.toml`, `package.json`, `meson.build`, `CMakeLists.txt`, `go.mod`, `*.so` NEEDED via `patchelf --print-rpath` / `ldd` / `readelf -d | grep NEEDED`. NEVER guess deps from memory.
                 For binary packages (helium tar.xz, rootapp AppImage, opencode-desktop .deb, protonplus AppImage, zen-browser tar.xz): tear apart exactly as `pkgs/*.nix` does, read internal version (`application.ini`, `package.json`, `helium --version` probe via `appimageTools`), compare sha256-SRI vs pinned `hash`. RE-TEAR if upstream changed at all since last audit.
              b. DERIVE TRUE RUNTIME DEPS from `ldd` of every ELF in extracted tree + `runtimeDeps` list. Every `NEEDED .so` must be in `runtimeDeps` via `makeLibraryPath` (or host-provided). For AppImage `wrapType2`, `appimageContents` already handles.
              c. COMPARE against `pkgs/*.nix` `runtimeDeps`: missing = bug, extra dead = rot. Fix.
              d. WEB-SEARCH-VERIFY every dep exists in `nixpkgs` under that exact `pkgs.<name>` (search `nix search nixpkgs#<name>` or `https://search.nixos.org/packages?query=<name>`, or `https://repology.org/project/<name>`). If not in nixpkgs, do NOT invent -- report.
              e. ALSO AUDIT `meta.*` per `pkgs/README.md`: `description` one sentence, capitalized, no period; `license` correct SPDX; `sourceProvenance` set for binary; `mainProgram` exact bin name; `platforms` linux; document any `version` pin (`unstable-YYYY-MM-DD` handling).
              f. APPLY AND VERIFY: add deps (alphabetized in `runtimeDeps`), `hash` update via `nix hash to-sri --type sha256 $(nix-prefetch-url --type sha256 <url>)` or `nix-prefetch-url`, commit, push, then `nix build .#packages.x86_64-linux.<pkg>` in `nixos/nix` container -- must build 0, then `nix run .#<pkg> -- --version` smoke. Retry 3×, revert + issue if still broken.
              g. MANDATORY DELIVERABLE - dependency audit table for EVERY package (all 5): | package | upstream deps found | in nix | missing/added | extra/dropped | status | (deps-verified/deps-fixed/blocked). If any package missing, run not finished.
              h. 2026 AUTOMATED EXCELLENCE CHECKS (MANDATORY - August 2026 Nix):
                 For EVERY nix you touched (and 5-sample), run and paste output:
                 - `nix flake check` -- must be clean (pure evaluation, no `builtins.currentSystem`, `with import <nixpkgs>` banned; `config = {}; overlays = [];`)
                 - `nixfmt` (or `nixpkgs-fmt`) -- `nixfmt pkgs/*.nix` must be clean or diff justified
                 - `nixpkgs-hammering` (`nix run github:jtojnar/nixpkgs-hammering <pkg>`) -- fix E: (meta, version starts with digit, no alias, license, mainProgram)
                 - `nix build .#packages.x86_64-linux.<pkg>` -- must build; `nix run .#<pkg> -- --version` smoke
                 - `nix flake lock --update-input nixpkgs` freshness: `flake.lock` nixpkgs rev vs `nixos-unstable` HEAD -- if >7d old, `nix flake update` + test build
                 - `fetchFromGitHub` preferred over raw `fetchurl` for GitHub sources; `hash` must be SRI `sha256-...` (nix hash to-sri), not hex; `version` must start with digit, handle `unstable-YYYY-MM-DD` correctly per `pkgs/README.md#Versioning`
                 Log each tool's 1-line result per package; any failure = deps-broken. Tools available via `tools/teardown-sweep.py:parse_nix` -- you may call it, but YOU do the reasoning. Teardown is done BY YOU, the agent, not by a separate pass-anyway script; sweep is auxiliary evidence, not the verdict.

            INSTALL-VERIFICATION + DOCKER BATTLE TEST (MANDATORY - `nix run` must work in a clean Nix container, not just `nix build`):
              SCOPE: 100% coverage of `packages.${system}.*`. Ledger in `.opencode-relay.md` (package | last install-tested | result). This run MUST test: (1) every touched/rebuilt, (2) every binary changed since last test, (3) oldest-uncovered.
              a. CLEAN NIX CONTAINER: `docker run --rm -v "$PWD:/repo" nixos/nix:latest bash -lc 'nix --extra-experimental-features "nix-command flakes" build /repo#packages.x86_64-linux.<pkg> && /repo/result/bin/<pkg> --version'`
                 If `result/bin` missing, check `meta.mainProgram`. Must exit 0. If docker missing, install it; never skip.
              b. `nix run github:Ackerman-00/nix-packages#<pkg> -- --version` must also work (flake-compat).
              c. Fix, rebuild, retest until green. Pure `result` libraries still get the build test; smoke may be skipped with reason.
              d. MANDATORY DELIVERABLE - install-test table: | package | nix build | nix run | smoke | status | (installable/fixed/broken). Any changed not tested = unfinished.
              e. ALL CONTENT + REPO ITSELF: `ls -R`/`find . -type f | sort` -- every `pkgs/*.nix` (`bash -n`, `nixfmt`, `nixpkgs-hammering`), `flake.nix`/`flake.lock` (`nix flake check`, `nix flake update` dry-run), `.github/workflows/*.yml` (`yaml.safe_load`), `README.md` (add `nix run` must match Docker path or fix README) must be checked; inside clean `nixos/nix` container `nix --extra-experimental-features "nix-command flakes" flake check` must pass. Any file not checked = gap.

            NEVER complete a run without tearing apart every package. The sweep is NOT a separate script -- YOU are the sweep.
            SWEEP SCRIPT IS CODE YOU OWN: tools/teardown-sweep.py and tools/docker-sweep.py exist as auxiliary tools you can call, but YOU do the reasoning. If they help, use them. If they break, fix them.

            VERIFICATION LOOP (MANDATORY - battle-tested 2026: pre-completion checklist + external verifier, agentpatterns.ai 2026-07-19): Before declaring `status: complete`, you MUST run `bash tools/verify-nix.sh` and paste its `----- VERIFICATION REPORT -----` output. It checks numerical completion (5 rows with `deps-verified`/`deps-fixed`), evidence strings (`nix flake check` / `nix build` / `nixfmt`), and install-test + battle test table. Exit 1 = NOT COMPLETE -- keep working until exit 0. Do NOT write `status: complete` if verifier fails. Prompt 70-90%, verifier+gate near-100%.


      - name: Verify completion (external, battle-tested 2026)
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "=== External verifier: tools/verify-nix.sh ==="
          bash tools/verify-nix.sh || {
            echo "::error::Verification FAILED -- relay missing 5-row deps table or evidence. Agent skipped mandatory audit."
            exit 1
          }

      - name: Upload opencode logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: opencode-logs
          path: ~/.local/share/opencode/log/
          if-no-files-found: ignore

  cleanup:
    runs-on: ubuntu-latest
    if: always()
    needs: opencode
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Open failure issue
        if: needs.opencode.result == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="autonomous run failed: $(date -u +%Y-%m-%d)"
          exists=$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" --jq "[.[] | select(.title == \"$title\")] | length")
          if [ "$exists" -eq 0 ]; then
            gh api repos/${GITHUB_REPOSITORY}/issues -f title="$title" -f body="The scheduled autonomous maintenance run failed at $(date -u '+%Y-%m-%d %H:%M UTC'). See: https://github.com/${GITHUB_REPOSITORY}/actions/runs/$GITHUB_RUN_ID (check the opencode-logs artifact and the relay state file)."
          else
            echo "failure issue for today already open - skipping"
          fi

      - name: Clean up stray opencode/schedule branches
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for ref in $(gh api repos/${GITHUB_REPOSITORY}/branches --paginate --jq '.[].name' | grep '^opencode/schedule-'); do
            echo "Deleting stray branch: $ref"
            gh api -X DELETE repos/${GITHUB_REPOSITORY}/git/refs/heads/"$ref" 2>/dev/null || echo "  (already deleted or not found)"
          done
