name: opencode-schedule

on:
  schedule:
    - cron: '0 0 2,5,8,11,14,17,20,23,26,29 * *'       # 36h cycle: runs at 00:00 on days ≡2 (mod 3)
    - cron: '0 12 3,6,9,12,15,18,21,24,27,30 * *'      # and 12:00 on days ≡0 (mod 3) - NEVER at the
                                                       # same 12h slot as check-updates or official-update
  workflow_dispatch:
    inputs:
      relay:
        description: 'Relay continuation run - pick up unfinished work from .opencode-relay.md'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  id-token: write

concurrency:
  group: opencode-schedule
  cancel-in-progress: false

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Configure git auth for pushes
        run: |
          git config --global user.name "opencode-agent[bot]"
          git config --global user.email "41898282+opencode-agent[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install opencode (latest)
        shell: bash
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Run opencode
        shell: bash
        run: |
          export PATH="$HOME/.opencode/bin:$PATH"
        env:
          PROMPT: |
            TEAR-APART SWEEP PROTOCOL (MANDATORY):
            YOU are the sweep. There is no separate script. You tear apart
            every package yourself, check it against upstream, and fix what's
            wrong. Do this as your FIRST action after reading the repo.

            HOW TO TEAR APART PACKAGES (do this for every package):

            1. LIST ALL PACKAGES:
               - Nix: find pkgs/ -name "*.nix" | sort

            2. FOR EACH PACKAGE — check version against upstream:
               a. Read the nix file to get version
               b. Query upstream for latest release via gh api or web search
               c. Compare vs upstream latest
               d. If STALE → update version and hashes, run nix-update or nix-prefetch

            3. FOR EACH BINARY PACKAGE — verify the artifact:
               a. Download and extract the artifact
               b. Look for version evidence inside
               c. Compare internal version vs pinned version

            4. CHECK DEPENDENCIES, TEST INSTALLS (nix-build), CHECK VULNERABILITIES

            NEVER complete a run without tearing apart every package.
            The sweep is NOT a separate script — YOU are the sweep.

            SWEEP SCRIPT IS CODE YOU OWN: tools/teardown-sweep.py and
            tools/docker-sweep.py exist as auxiliary tools you can call, but
            YOU do the reasoning. If they help, use them. If they break, fix them.
      # ---- topic: teardown-sweep ----
      - name: Tear-Apart Sweep (all ebuilds, all artifacts)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > teardown_sweep.sh << 'TDSHEOF'
          #!/bin/bash
          set -euo pipefail
          python3 /overlay/tools/teardown-sweep.py --overlay /overlay --report /overlay/teardown-report.md --autofix
          # Also run Docker sweep with Trivy CVE scanning
          python3 /overlay/tools/docker-sweep.py --overlay /overlay --type nix --scan-images --report /overlay/docker-report.md 2>/dev/null || true
          TDSHEOF
          chmod +x teardown_sweep.sh
          docker run --rm -e GITHUB_TOKEN -v "${{ github.workspace }}:/overlay" gentoo/stage3:amd64-desktop-openrc bash /overlay/teardown_sweep.sh

      - name: Upload opencode logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: opencode-logs
          path: ~/.local/share/opencode/log/
          if-no-files-found: ignore

  cleanup:
    runs-on: ubuntu-latest
    if: always()
    needs: opencode
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Open failure issue
        if: needs.opencode.result == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="autonomous run failed: $(date -u +%Y-%m-%d)"
          exists=$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" --jq "[.[] | select(.title == \"$title\")] | length")
          if [ "$exists" -eq 0 ]; then
            gh api repos/${GITHUB_REPOSITORY}/issues -f title="$title" -f body="The scheduled autonomous maintenance run failed at $(date -u '+%Y-%m-%d %H:%M UTC'). See: https://github.com/${GITHUB_REPOSITORY}/actions/runs/$GITHUB_RUN_ID (check the opencode-logs artifact and the relay state file)."
          else
            echo "failure issue for today already open - skipping"
          fi

      - name: Clean up stray opencode/schedule branches
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for ref in $(gh api repos/${GITHUB_REPOSITORY}/branches --paginate --jq '.[].name' | grep '^opencode/schedule-'); do
            echo "Deleting stray branch: $ref"
            gh api -X DELETE repos/${GITHUB_REPOSITORY}/git/refs/heads/"$ref" 2>/dev/null || echo "  (already deleted or not found)"
          done
