name: opencode-schedule

on:
  schedule:
    - cron: '10 */6 * * *'   # Every 6 hours at :10 - 10 min after the top-of-hour updaters
  workflow_dispatch:
    inputs:
      relay:
        description: 'Relay continuation run - pick up unfinished work from .opencode-relay.md'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  id-token: write

concurrency:
  group: opencode-schedule
  cancel-in-progress: false

jobs:
  opencode:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Configure git auth for pushes
        run: |
          git config --global user.name "opencode-agent[bot]"
          git config --global user.email "41898282+opencode-agent[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install opencode (latest, resilient)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          mkdir -p "$HOME/.opencode/bin"
          export PATH="$HOME/.opencode/bin:$PATH"
          # 1) Official V2 installer, retried (the V1 installer at
          #    https://opencode.ai/install ships opencode 1.x - V2 lives at
          #    https://opencode.ai/v2/install, verified 2026-09-21).
          for i in 1 2 3 4; do
            if curl -fsSL --retry 3 --retry-delay 10 --retry-all-errors https://opencode.ai/v2/install | bash; then
              break
            fi
            echo "opencode install attempt $i/4 failed - sleeping 30s"
            sleep 30
          done
          # 2) npm fallback (V2 package). Link into $HOME/.opencode/bin.
          if ! command -v opencode >/dev/null 2>&1; then
            echo "official installer failed - trying npm"
            npm install -g @opencode/cli || sudo npm install -g @opencode/cli || true
            if command -v opencode >/dev/null 2>&1; then
              ln -sf "$(command -v opencode)" "$HOME/.opencode/bin/opencode"
            fi
          fi
          # 3) Authenticated GitHub-release fallback (5000/hr quota).
          #    V2 releases live at opencode-ai/opencode; asset discovered live.
          if ! command -v opencode >/dev/null 2>&1; then
            echo "npm fallback failed - trying authenticated gh release download"
            asset="$(gh release view --repo opencode-ai/opencode --json assets --jq '.assets[].name' | grep -E '^opencode-linux-(x86_64|x64|amd64).*\.(tar\.gz|tgz|zip)$' | head -n 1)"
            if [ -n "$asset" ]; then
              echo "downloading asset: $asset"
              mkdir -p /tmp/opencode-dl
              gh release download --repo opencode-ai/opencode --pattern "$asset" --dir /tmp/opencode-dl --clobber
              case "$asset" in
                *.zip) unzip -o /tmp/opencode-dl/"$asset" -d "$HOME/.opencode/bin" ;;
                *) tar -xzf /tmp/opencode-dl/"$asset" -C "$HOME/.opencode/bin" ;;
              esac
            else
              echo "no linux x64 asset found in latest opencode-ai/opencode release"
            fi
          fi
          # Hard gate + V1 tripwire (2026-09-21: V1 installer ships 1.x -
          # fail fast, never run a job on V1).
          command -v opencode && opencode --version
          ver="$(opencode --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)"
          case "$ver" in
            1.*) echo "FATAL: opencode V1 ($ver) installed - V2 required, aborting run" >&2; exit 1 ;;
            *) echo "opencode version OK: $ver (V2+)" ;;
          esac

      - name: Run opencode
        shell: bash
        run: |
          export PATH="$HOME/.opencode/bin:$PATH"
          # raw.githubusercontent.com serves CDN-stale content (~5min max-age=300) after a
          # push, and its CDN ignores cache-busting query params. Read the relay via the
          # git protocol first, then the GitHub API; never via raw.githubusercontent.com.
          gate_passes() {
            git fetch -q origin +refs/heads/main:refs/remotes/origin/main >/dev/null 2>&1 || true
            local content=""
            content="$(git show origin/main:.opencode-relay.md 2>/dev/null || true)"
            if [ -z "$content" ]; then
              content="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.opencode-relay.md?ref=main" --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || true)"
            fi
            # Same bar as tools/verify-nix.sh - keep both in sync. The inline
            # gate must never be weaker than the external verifier.
            printf '%s' "$content" | grep -qx "run_id: $RUN_ID" || return 1
            printf '%s' "$content" | grep -qi "status: complete" || return 1
            printf '%s' "$content" | grep -qi "PACKAGE.*BR\|deps-verified\|dependency audit" || return 1
            local expected dep_rows unproven_rows teardown_pass tool
            expected=$(find pkgs -maxdepth 1 -name '*.nix' 2>/dev/null | wc -l)
            [ "$expected" -gt 0 ] || return 1
            dep_rows=$(printf '%s' "$content" | grep -c "deps-verified\|deps-fixed\|version-checked" || true)
            [ "$dep_rows" -ge "$expected" ] || return 1
            printf '%s' "$content" | grep -qi "DOCKER BATTLE TEST" || return 1
            for tool in "nix flake check" "nix build" "nixfmt"; do
              printf '%s' "$content" | grep -qi "$tool.*PASS\|PASS.*$tool" || return 1
            done
            printf '%s' "$content" | grep -qi "install-test table" || return 1
            local mains_pkg
            mains=$(find pkgs -maxdepth 1 -name '*.nix' -exec basename {} .nix \;)
            for mains_pkg in $mains; do
              printf '%s' "$content" | grep -qiE "nix-teardown: $mains_pkg img:sha256:[0-9a-f]{12,} .*PASS" || return 1
            done
            today=$(date -u +%F); yest=$(date -u -d yesterday +%F 2>/dev/null || date -u -v-1d +%F)
            printf '%s' "$content" | grep -qiE "gh-rate: [0-9]+/[0-9]+ .*($today|$yest)" || return 1
            for mains_pkg in $mains; do
              printf '%s' "$content" | grep -qiE "upstream: $mains_pkg .*($today|$yest)" || return 1
            done
            return 0
          }
          # Start jitter: desync from the thundering herd on free-model gateways.
          sleep $((RANDOM % 180))
          for model in "opencode/muse-spark-1.3-contributor-free" "opencode/mimo-v2.6-flash-free" "opencode/mimo-v2.5-free" "opencode/deepseek-v4-flash-free" "opencode/muse-spark-1.2-contributor-free" "opencode/big-pickle" "opencode/nemotron-3.5-lightning-free" "opencode/nemotron-3-ultra-free" "opencode/ling-3.0-flash-fin-free"; do
            echo "=== opencode run attempt with $model ==="
            exit_code=0
            # Per-model retries with backoff: free-tier gateways drop sockets
            # under load. Retry the SAME model (3 tries, full jitter) before
            # falling through. Bounded so one dead model can't eat the run.
            for attempt_n in 1 2 3; do
              if MODEL="$model" opencode run --standalone --model "$model" --agent build "$PROMPT"; then
                exit_code=0
                break
              fi
              exit_code=$?
              if [ "$attempt_n" -lt 3 ]; then
                delay=$((RANDOM % (120 * attempt_n)))
                echo "=== $model try $attempt_n/3 failed (exit $exit_code) - backing off ${delay}s ==="
                sleep "$delay"
              fi
            done
            if [ "$exit_code" -eq 0 ]; then
              ok=0
              for attempt in $(seq 1 10); do
                if gate_passes; then
                  ok=1
                  break
                fi
                echo "=== gate attempt $attempt: relay not confirmed yet (origin/main=$(git rev-parse --short origin/main 2>/dev/null || echo missing)) - retrying ==="
                sleep 45
              done
              if [ "$ok" -eq 1 ]; then
                echo "=== $model completed the full job (.opencode-relay.md on main confirms run $RUN_ID complete) ==="
                exit 0
              fi
              echo "=== $model exited 0 but .opencode-relay.md on main does not confirm run $RUN_ID complete - run is INCOMPLETE, treating as failure ==="
            else
              echo "=== attempt with $model failed (exit $exit_code) - trying next ==="
            fi
            # Long inter-model sleep: hammering a loaded gateway faster makes it worse.
            sleep 60
          done
          exit 1
        env:
          MODEL: opencode/muse-spark-1.3-contributor-free
          OPENCODE_CONFIG_CONTENT: '{"agents":{"title":{"model":"opencode/mimo-v2.5-free"}}}'
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELAY: ${{ github.event.inputs.relay || 'false' }}
          RUN_ID: ${{ github.run_id }}
          GIT_AUTHOR_NAME: opencode-agent[bot]
          GIT_AUTHOR_EMAIL: 41898282+opencode-agent[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: opencode-agent[bot]
          GIT_COMMITTER_EMAIL: 41898282+opencode-agent[bot]@users.noreply.github.com
          PROMPT: |
            You are the FULLY AUTONOMOUS maintainer of nix-packages
            (https://github.com/Ackerman-00/nix-packages), a Nix flake providing
            binary-native packages (AppImage/tar.xz via fetchurl + patchelf/makeWrapper)
            plus rev-pinned source builds (niri-unstable, xwayland-satellite-unstable)
            for x86_64-linux + aarch64-linux via `github:Ackerman-00/nix-packages` flake.

            RELAY / LONG-RUN HANDOFF (MANDATORY): a run may last up to ~6 hours
            (timeout-minutes: 355). NEVER let a run die with work unfinished or
            unrecorded - hand it over to the next runner. The relay state file is
            `.opencode-relay.md` at the repo root - it is the SINGLE completion
            record, and the workflow reads it from main after your process exits:
            it must contain the exact line `run_id: $RUN_ID` (RUN_ID = the env
            var value, e.g. "run_id: 1234567890") and a terminal status. If it
            does NOT, the run is treated as FAILED. NEVER create separate
            completion files; never delete `.opencode-relay.md`.
              a. PICKUP ON START: if `.opencode-relay.md` exists on main with
                 status "unfinished", or this run was started with relay=true
                 (env RELAY=1), READ IT FIRST and continue that work FIRST.
              b. KEEP STATE CURRENT: as you work, keep `.opencode-relay.md`
                 updated. Commit + push it together with your fixes.
              c. HANDOFF TRIGGER: when the run has been going ~5-5.5 hours,
                 STOP starting new work. Finish and push everything, set
                 `.opencode-relay.md` to status "unfinished" with the precise
                 continuation plan, commit + push, then trigger the relay:
                   gh workflow run opencode-schedule.yml --ref main \
                     --repo Ackerman-00/nix-packages -f relay=true
              d. COMPLETION: when all work is done, set the relay to
                 `status: complete` and add `run_id: $RUN_ID` (the ACTUAL
                 numeric value, not the literal text) to `.opencode-relay.md`,
                 then commit + push.

            GIT IDENTITY (MANDATORY - "ONLY opencode-agent[bot], NOTHING ELSE").
            The ONLY allowed commit identity is exactly
            `opencode-agent[bot] <41898282+opencode-agent[bot]@users.noreply.github.com>`.
            NEVER run `git config user.name` / `git config user.email`.
            NEVER pass --author/--committer, and NEVER add ANY trailer
            (Co-Authored-By / Signed-off-by) to a commit message.
            NEVER invent or guess any email address.
            Always `git fetch origin && git pull --rebase origin main` before pushing.

            UNDERSTAND WHAT THIS REPO IS. It is a Nix flake (`flake.nix` + `flake.lock`)
            exposing `packages.${system}.*` via `pkgs.callPackage ./pkgs/*.nix` for
            `x86_64-linux` + `aarch64-linux`. Each package is `fetchurl`+`mkDerivation`+`patchelf`+`makeWrapper` (zen-browser tar.xz, splayer-next tarball) or `appimageTools.extractType2/wrapType2` (rootapp) or source-built (mixtapes). Built via `nix build` / `nix run`. Inventory is DERIVED every run via `ls pkgs/*.nix` - NEVER hardcode a package list or count. Read `flake.nix`, `pkgs/*.nix`, `README.md` before touching anything.

            CONTEXT
            - Packages live as `pkgs/<name>.nix` (zen-browser.nix, rootapp.nix, niri-unstable.nix, etc.) + `flake.nix` `forAllSystems` + `flake.lock` pins nixpkgs `nixos-unstable`.
            - Binary-native packages must set `meta.sourceProvenance = with lib.sourceTypes; [ binaryNativeCode ]` (pkgs/README.md), `meta.license`, `meta.description` (one sentence, capitalized, no period, factual), `meta.mainProgram`, `meta.platforms = lib.platforms.linux`, `meta.maintainers`.
            - `version` must start with digit, `fetchurl`/`fetchFromGitHub` must have SRI `sha256-...` hash (not hex), `allowUnfree = true` for proprietary (rootapp).
            - `flake.lock` pins `nixpkgs` -- `nix flake update` bumps it; only files `git add`ed are copied into store (pure evaluation).
            - Tools: `nix` (2.4+ flakes, experimental-features `nix-command flakes`), `nixpkgs-review`, `nixfmt`, `nixpkgs-hammering`, `nixos/nix` docker.

            WEB SEARCH IS YOUR PRIMARY VERIFICATION TOOL. Use `gh api` for GitHub API (NOT curl). For every package, web-search `nixpkgs <pkg>` and upstream `github.com/<owner>/<repo>/releases/latest` to confirm latest version, `url`+`hash` resolve (`curl -sI` 200 for non-GitHub distfiles, `nix-prefetch-url` or `nix hash to-sri --type sha256`), and check `repology` + `Nix User Repository` for freshness. NEVER trust a version/hash you haven't verified.
            - GITHUB API RATE LIMITS (2026 community best practice - docs.github.com/rest/using-the-rest-api/rate-limits-for-the-rest-api + dev.to 2026-08-19): unauthenticated = 60/hour (IP-shared, 304 still costs 1), GITHUB_TOKEN via `gh api` = 1000/hour per repo (Actions) / PAT = 5000/hour. NEVER use `curl https://api.github.com/...` without token -- ALWAYS use `gh api repos/<owner>/<repo>/releases/latest --jq .tag_name` with `gh api --cache 3600s`. If you must use curl for GitHub, add `-H "Authorization: token $GITHUB_TOKEN"` -- unauth 304 does NOT save quota. Prefer `gh api` and check `gh api rate_limit`.

            PACKAGE DEPENDENCY DEEP AUDIT (MANDATORY - "TEAR EVERY PACKAGE APART"; applies to every package, every run):
              a0. CHECK OFFICIAL PACKAGING FIRST (2026 advanced -- web search latest, August 2026): For `{pkg}`, first check the official distro packaging -- nixpkgs (github.com/NixOS/nixpkgs/pkgs/<category>/<pkg>/default.nix + search.nixos.org) (`git clone --depth 1 https://github.com/NixOS/nixpkgs.git /tmp/nixpkgs && find /tmp/nixpkgs/pkgs -type f -name "default.nix" -path "*/<pkg>/*"`) -- if found, read its `buildInputs`/`runtimeDeps`/`version` as the latest reference for dependencies (official is where newer default.nix land first). If official has a newer default.nix/dependencies than ours, align with it (keep our flake's `allowUnfree`/`binaryNativeCode`). If official has no default.nix for this package (404 / no file), then proceed to tear apart upstream `tar`/`deb`/`rpm`/`AppImage` in Docker as below -- download into `/tmp` (never repo tree), extract, and derive deps from inside (`ldd` `NEEDED` vs `runtimeDeps` vs `RDEPEND` etc.). Web-search 2026 for official + upstream before deciding.
              a. OPEN THE PACKAGE. Read FULL `pkgs/<pkg>.nix` (`pname`, `version`, `archives` per system, `runtimeDeps`/`buildInputs`, `nativeBuildInputs` `patchelf`/`makeWrapper`, `rpath = lib.makeLibraryPath`, `meta`). Download `fetchurl` URL into /tmp (gitignored) and EXTRACT (`tar xf`, `ar x`+`tar xf`, `unsquashfs` for AppImage). Inspect upstream files: `Cargo.toml`, `package.json`, `meson.build`, `CMakeLists.txt`, `go.mod`, `*.so` NEEDED via `patchelf --print-rpath` / `ldd` / `readelf -d | grep NEEDED`. NEVER guess deps from memory.
                 For binary packages (zen-browser tar.xz, rootapp AppImage, splayer-next tarball, mixtapes source): tear apart exactly as `pkgs/*.nix` does, read internal version (`application.ini`, `package.json`, desktop files, `--version` probes), compare sha256-SRI vs pinned `hash`. RE-TEAR if upstream changed at all since last audit.
              b. DERIVE TRUE RUNTIME DEPS from `ldd` of every ELF in extracted tree + `runtimeDeps` list. Every `NEEDED .so` must be in `runtimeDeps` via `makeLibraryPath` (or host-provided). For AppImage `wrapType2`, `appimageContents` already handles.
              c. COMPARE against `pkgs/*.nix` `runtimeDeps`: missing = bug, extra dead = rot. Fix.
              d. WEB-SEARCH-VERIFY every dep exists in `nixpkgs` under that exact `pkgs.<name>` (search `nix search nixpkgs#<name>` or `https://search.nixos.org/packages?query=<name>`, or `https://repology.org/project/<name>`). If not in nixpkgs, do NOT invent -- report.
              e. ALSO AUDIT `meta.*` per `pkgs/README.md`: `description` one sentence, capitalized, no period; `license` correct SPDX; `sourceProvenance` set for binary; `mainProgram` exact bin name; `platforms` linux; document any `version` pin (`unstable-YYYY-MM-DD` handling).
              f. APPLY AND VERIFY: add deps (alphabetized in `runtimeDeps`), `hash` update via `nix hash to-sri --type sha256 $(nix-prefetch-url --type sha256 <url>)` or `nix-prefetch-url`, commit, push, then `nix build .#packages.x86_64-linux.<pkg>` in a FRESH `nixos/nix:latest` container -- must build 0, then `nix run .#<pkg> -- --version` smoke. Retry 3×, revert + issue if still broken. PROVENANCE (2026-09-22, no exceptions): teardown evidence counts ONLY from fresh `nixos/nix` containers - host-nix builds (including the preinstalled nix in /oc jobs) are eval-only hints, never evidence. Every teardown token carries the container image digest: `nix-teardown: <pkg> img:sha256:<12+hex of the pulled nixos/nix image> build PASS run PASS` (get it via `docker images --digests nixos/nix` or `docker inspect`). Every GitHub API call uses `gh api` with GITHUB_TOKEN (never bare curl - the 60/hr unauthenticated quota burns out and lies by omission); prove it with one relay line `gh-rate: <remaining>/<limit> <today-UTC-date>` from `gh api rate_limit --jq`. A teardown token without a digest, or upstream lines without a fresh gh-rate line, fails the gate.
              g. MANDATORY DELIVERABLE - dependency audit table for EVERY package (derive the inventory via `ls pkgs/*.nix`, NEVER hardcode the count): | package | upstream deps found | in nix | missing/added | extra/dropped | status | (deps-verified/deps-fixed/version-checked/blocked). HONEST LABELS (2026-09-22, enforced by the verifier): `deps-verified` ONLY with this run's `nix-teardown: <pkg> build PASS run PASS` token (fresh-container `nix build` + `nix run` smoke); `deps-fixed` when you changed the nix AND rebuilt after; `version-checked` for updater/tags/API freshness WITHOUT a container teardown. A `deps-verified` row with no teardown token is a gate failure. If any package missing, run not finished.
              g2. ALWAYS-LIVE (2026-09-22, no exceptions, no carry-over): upstream + dependency checks for EVERY package run FRESH every run with raw output pasted in the relay, one line per package: `upstream: <pkg> <ref>@<ver> == nix | <cmd> | <today-UTC-date>` (the UTC date proves the check ran this run - the verifier rejects lines dated any other day). Rev-pinned source builds (niri-unstable, xwayland-satellite-unstable, umbriel-unstable): `git ls-remote HEAD` check per update.yml rust_rev_update (metadata only - rev/hash/version; a rev that doesn't compile is caught by nixcache's build, never silently shipped). Reusing a previous run's conclusion is a gate failure even if upstream did not move.
              g3. NIRI-STACK WATCHER (STRICT, 2026-09-22 - niri-unstable + xwayland-satellite-unstable + umbriel-unstable are source builds; a silent upstream change breaks compilation and NO binary cache can save a package that doesn't build):
                 - UPSTREAM FLAKE DEP-DIFF every run: fetch niri-wm/niri's flake.nix inputs + buildInputs list live and diff against our pkgs/niri-unstable.nix buildInputs (same for xwayland-satellite Cargo.toml [dependencies]/[features] vs ours, and noctalia-dev/umbriel's nix/package.nix inputs vs our pkgs/umbriel-unstable.nix buildInputs). Any upstream-added dep (new library, new feature flag, renamed input like a libdisplay-info bump) = spec bug until mirrored into our expression + rebuilt green the SAME run.
                 - UPSTREAM REFERENCE FILES (exact, fetch every run - no substitutes):
                   niri-unstable <- niri-wm/niri `flake.nix` (nativeBuildInputs/buildInputs/features), `Cargo.toml` + `Cargo.lock` (git deps!), `build.rs`, repo tree (new dirs break filesets);
                   xwayland-satellite-unstable <- Supreeeme/xwayland-satellite `Cargo.toml` ([dependencies]/[features]/[build-dependencies] incl. vergen), `build.rs`, `resources/`, `macros/` + `wl_drm/` + `testwl/` (workspace members);
                   umbriel-unstable <- noctalia-dev/umbriel `nix/package.nix` (THEIR inputs list, the sibling reference), `meson.build` (dependency() + find_program() + option() deltas), `subprojects/*.wrap` (umbrielfx!), repo tree;
                   xdg-desktop-portal-umbriel-unstable <- noctalia-dev/xdg-desktop-portal-umbriel `meson.build` (dependency() version floors!), repo tree.
                   Diff each against our expression the SAME run; any delta in either direction is resolved with evidence (adopt theirs, keep ours with upstream proof, record verdict per line).
                 - GH FETCH DISCIPLINE (2026-09-22, token-safe + poison-aware):
                   fetch files ONLY via `gh api repos/<owner>/<repo>/contents/<path>?ref=<ref> --jq '.content' | base64 -d` (authenticated = 5000/hr; targeted, no full clones). NEVER raw.githubusercontent.com (60/hr shared quota + ~5min CDN staleness) and NEVER bare `curl https://api.github.com` (burns the shared quota, 304s still cost).
                   `--cache 3600s` is allowed ONLY for slow-moving reference data (Terra specs, Pagure lists, upstream packaging files). NEVER for version-truth (HEAD/ls-remote/latest-tag/Cargo.lock diffs): gh's disk cache replays error/stale responses for hours (cli/cli#12812, still open 2026-07 - a poisoned entry makes "unchanged" a lie the gate cannot detect). Suspect staleness for even one second → `gh config clear-cache` (or rm -rf ~/.cache/gh) and re-fetch live, then say so in the relay.
                 - CARGO DEPS: diff Cargo.lock package list (both repos) against last run's recorded list in the relay; new crates are fine (cargoHash refresh covers them) but new SYSTEM deps behind a crate (pkg-config probes, bindgen headers, vergen git metadata) must map to an explicit nixpkgs input - `ldd` the built binaries and account every NEEDED.
                 - NO-HARDCODE RULE (2026-09-22, upstream contract): NEVER wrap xwayland-satellite into niri/umbriel (or vice versa). Both upstreams treat satellite as OPTIONAL external software discovered on PATH at runtime (niri docs: "ensure >= 0.7 is installed and available in $PATH"; umbriel docs: "must be installed and on PATH"). Pinning one build inside the other fights user choice and rots silently. X11 support = installing xwayland-satellite-unstable ALONGSIDE (README pairing), nothing more.
                 - SMOKE (nixos/nix container, headless-safe): `niri --help` exit 0 + `xwayland-satellite --help` exit 0. Full compositor launch is impossible headless and is NOT required; build exit 0 + wrapper proof + help smokes ARE.
                 - BUILDABLE is proven ONLY by this run's `nix build` exit 0 on the CURRENT rev. Never "it built last run", never "upstream CI is green". If HEAD moved and the build fails: revert per update.yml, open/refresh the issue with the log lines, keep last-good pin + last-good binaries serving users.
                 - nixcache.yml publishes ONLY green builds (it fires on push; a reverted bump pushes nothing, so nothing stale ever publishes).
                 - RELAY CHAIN (2026-09-22): update.yml dispatches the nixcache build relay head after bumping; each nixcache run builds exactly ONE package then relays the rest (`-f packages="..."`), so a timeout can only ever kill a single package's build. Never "optimize" this into one big matrix build.
                 - RELEASE HYGIENE (2026-09-22, STRICT): ONE rolling tag (`nixcache`) for all packages; per-package manifests (`manifest-<pkg>.txt`) answer "which files belong to which package" - that is how you tell them apart, never by tag proliferation. Each manifest holds ONLY its package's current-rev files - old revs are garbage, never history. NEVER hand-delete release assets, NEVER hardcode asset names anywhere. Every run: the union of all per-package manifests is what the release must contain; any asset older than the run outside that union is a leak - delete it via `gh release delete-asset` and record why it survived. A manifest holding two revs of one package is a FAILED run, not a backlog item.
              h. 2026 AUTOMATED EXCELLENCE CHECKS (MANDATORY - August 2026 Nix):
                 For EVERY nix you touched (and at least a 3-sample of the full inventory - derive the count via `ls pkgs/*.nix`, NEVER hardcode the number), run and paste output:
                 - `nix flake check` -- must be clean (pure evaluation, no `builtins.currentSystem`, `with import <nixpkgs>` banned; `config = {}; overlays = [];`)
                 - `nixfmt` (or `nixpkgs-fmt`) -- `nixfmt pkgs/*.nix` must be clean or diff justified
                 - `nixpkgs-hammering` (`nix run github:jtojnar/nixpkgs-hammering <pkg>`) -- fix E: (meta, version starts with digit, no alias, license, mainProgram)
                 - `nix build .#packages.x86_64-linux.<pkg>` -- must build; `nix run .#<pkg> -- --version` smoke
                 - `nix flake lock --update-input nixpkgs` freshness: `flake.lock` nixpkgs rev vs `nixos-unstable` HEAD -- if >7d old, `nix flake update` + test build
                 - `fetchFromGitHub` preferred over raw `fetchurl` for GitHub sources; `hash` must be SRI `sha256-...` (nix hash to-sri), not hex; `version` must start with digit, handle `unstable-YYYY-MM-DD` correctly per `pkgs/README.md#Versioning`
                 Log each tool's 1-line result per package; any failure = deps-broken. Tools available via `tools/teardown-sweep.py:parse_nix` -- you may call it, but YOU do the reasoning. Teardown is done BY YOU, the agent, not by a separate pass-anyway script; sweep is auxiliary evidence, not the verdict.

            INSTALL-VERIFICATION + DOCKER BATTLE TEST (MANDATORY - `nix run` must work in a clean Nix container, not just `nix build`):
              SCOPE: 100% coverage of `packages.${system}.*`. Ledger in `.opencode-relay.md` (package | last install-tested | result). This run MUST test: (1) every touched/rebuilt, (2) every binary changed since last test, (3) oldest-uncovered.
              a. CLEAN NIX CONTAINER: `docker run --rm -v "$PWD:/repo" nixos/nix:latest bash -lc 'nix --extra-experimental-features "nix-command flakes" build /repo#packages.x86_64-linux.<pkg> && /repo/result/bin/<pkg> --version'`
                 If `result/bin` missing, check `meta.mainProgram`. Must exit 0. If docker missing, install it; never skip.
              b. `nix run github:Ackerman-00/nix-packages#<pkg> -- --version` must also work (flake-compat).
              c. Fix, rebuild, retest until green. Pure `result` libraries still get the build test; smoke may be skipped with reason.
              d. MANDATORY DELIVERABLE - install-test table: | package | nix build | nix run | smoke | status | (installable/fixed/broken). Any changed not tested = unfinished.
              e. ALL CONTENT + REPO ITSELF: `ls -R`/`find . -type f | sort` -- every `pkgs/*.nix` (`bash -n`, `nixfmt`, `nixpkgs-hammering`), `flake.nix`/`flake.lock` (`nix flake check`, `nix flake update` dry-run), `.github/workflows/*.yml` (`yaml.safe_load`), `README.md` (add `nix run` must match Docker path or fix README) must be checked; inside clean `nixos/nix` container `nix --extra-experimental-features "nix-command flakes" flake check` must pass. Any file not checked = gap.

            NEVER complete a run without tearing apart every package. The sweep is NOT a separate script -- YOU are the sweep.
            SWEEP SCRIPT IS CODE YOU OWN: tools/teardown-sweep.py and tools/docker-sweep.py exist as auxiliary tools you can call, but YOU do the reasoning. If they help, use them. If they break, fix them.

            VERIFICATION LOOP (MANDATORY - battle-tested 2026: pre-completion checklist + external verifier, agentpatterns.ai 2026-07-19): Before declaring `status: complete`, you MUST run `bash tools/verify-nix.sh` and paste its `----- VERIFICATION REPORT -----` output. It checks numerical completion (one audit row per `ls pkgs/*.nix` package with `deps-verified`/`deps-fixed`/`version-checked`), evidence strings (`nix flake check` / `nix build` / `nixfmt` with PASS), install-test + battle test tables, one `nix-teardown: <pkg> img:sha256:<digest> build PASS run PASS` token per inventory package (fresh nixos/nix container digest, never host-nix), one `gh-rate: <remaining>/<limit> <today-UTC-date>` token-provenance line, and one fresh `upstream: <pkg> ... <today-UTC-date>` live-check line per package. Exit 1 = NOT COMPLETE -- keep working until exit 0. Do NOT write `status: complete` if verifier fails. Prompt 70-90%, verifier+gate near-100%.

            CLOSE THE FAILURE ISSUE WHEN FIXED (MANDATORY): After `tools/verify-nix.sh` passes and you have committed `status: complete` with `run_id: $RUN_ID` to `.opencode-relay.md` on `main`, you MUST close any open issue titled `autonomous run failed:*` — it is the record of the previous failure you just fixed. Run `gh api repos/${GITHUB_REPOSITORY}/issues?state=open --jq '.[] | select(.title | startswith("autonomous run failed")) | .number'` to find it, then for each number run `gh issue close <n> --reason completed --comment "Fixed by $RUN_ID ($GITHUB_SHA): verification passed (sweep + docker teardown all pkgs + flake check + nixfmt) and relay is now status: complete. See https://github.com/${GITHUB_REPOSITORY}/actions/runs/$GITHUB_RUN_ID."` . Every fix gets a closing comment with evidence; never leave a fixed failure issue open.

            ISSUE CLASSES (2026-09-22: every issue is AUTO or OWNER-ACL). AUTO (fix+verify+close yourself): nix expression bugs, wrong/stale versions, bad hashes, missing runtime deps, broken wrappers/desktop entries, failed builds, docs, triage replies. OWNER-ACL (only secrets-gated or infra: tokens, outages, upstream withdrawals): comment ONCE per issue per run MAXIMUM, maintain ONE consolidated `needs-owner:` list in .opencode-relay.md updated in place - never repeated "still blocked" spam. A new OWNER-ACL item gets a new issue ONLY if no open issue already tracks it.

      - name: Verify completion (external, battle-tested 2026)
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "=== External verifier: tools/verify-nix.sh ==="
          bash tools/verify-nix.sh || {
            echo "::error::Verification FAILED -- relay missing per-package audit rows or evidence strings. Agent skipped mandatory audit."
            exit 1
          }

      - name: Upload opencode logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: opencode-logs
          path: ~/.local/share/opencode/log/
          if-no-files-found: ignore

  cleanup:
    runs-on: ubuntu-24.04
    if: always()
    needs: opencode
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Open failure issue
        if: needs.opencode.result == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="autonomous run failed: $(date -u +%Y-%m-%d)"
          exists=$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" --jq "[.[] | select(.title == \"$title\")] | length")
          if [ "$exists" -eq 0 ]; then
            gh api repos/${GITHUB_REPOSITORY}/issues -f title="$title" -f body="The scheduled autonomous maintenance run failed at $(date -u '+%Y-%m-%d %H:%M UTC'). See: https://github.com/${GITHUB_REPOSITORY}/actions/runs/$GITHUB_RUN_ID (check the opencode-logs artifact and the relay state file)."
          else
            echo "failure issue for today already open - skipping"
          fi

      - name: Close failure issue on success
        if: needs.opencode.result == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for n in $(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" --jq '.[] | select(.title | startswith("autonomous run failed")) | .number'); do
            echo "Closing failure issue #$n (run $GITHUB_RUN_ID succeeded, verification passed)"
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/$n" -f state=closed -f state_reason=completed >/dev/null
            gh api "repos/${GITHUB_REPOSITORY}/issues/$n/comments" -f body="Closed automatically: the next scheduled run (\`$GITHUB_RUN_ID\`) passed verification (\`tools/verify-nix.sh\` exit 0, relay \`run_id: $GITHUB_RUN_ID\` + \`status: complete\`). See https://github.com/${GITHUB_REPOSITORY}/actions/runs/$GITHUB_RUN_ID." >/dev/null || true
          done

      - name: Clean up stray opencode/schedule branches
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for ref in $(gh api repos/${GITHUB_REPOSITORY}/branches --paginate --jq '.[].name' | grep '^opencode/schedule-'); do
            echo "Deleting stray branch: $ref"
            gh api -X DELETE repos/${GITHUB_REPOSITORY}/git/refs/heads/"$ref" 2>/dev/null || echo "  (already deleted or not found)"
          done
