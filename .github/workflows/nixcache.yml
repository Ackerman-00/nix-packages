name: Nix Binary Cache (rolling release)

on:
  schedule:
    - cron: '20 */3 * * *'   # Every 3 hours at :20 - middle between update.yml (:00) and opencode-schedule (:10), catches anything push-trigger missed
  push:
    paths:
      - 'pkgs/niri-unstable.nix'
      - 'pkgs/xwayland-satellite-unstable.nix'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/nixcache.yml'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Republish even if narinfos already exist'
        required: false
        default: 'false'
        type: boolean
      packages:
        description: 'Space-separated build queue; this run builds the head then relays the tail'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  # Single shared group with a real FIFO queue (GitHub changelog 2026-05-07:
  # `queue: max` holds up to 100 pending runs and processes them sequentially
  # instead of canceling the queued run). This replaces BOTH the old shared
  # group (which ate pending relay runs: "higher priority waiting request")
  # AND per-queue groups (complex, still racy on the manifest). Every trigger
  # - push, schedule, relay - simply queues and executes in order. Publish
  # stays idempotent + GC time-guarded as defense in depth.
  group: nixcache
  cancel-in-progress: false
  queue: max

jobs:
  build-sign-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes fetch-closure
            # NOTE (2026-09-22, owner decision): NO binary substituters here,
            # NO action caches. Every CI build is a full honest compile from
            # scratch - slow is fine. Skipping already-published revs is
            # handled by the needs-build gate below (narinfo probe), not by
            # caches. Failures go red and the opencode-scheduler agent fixes
            # them; that loop is the reliability mechanism, not caching.

      - name: Parse package queue (one package per run, relay the rest)
        run: |
          PKGS="${{ github.event.inputs.packages }}"
          # Default queue = every rev-pinned source build, derived live
          # (never hardcoded); niri-unstable first, rest alphabetical.
          if [ -z "$PKGS" ]; then
            REVPKGS=$(grep -l 'rev = "[0-9a-f]\{40\}"' pkgs/*.nix 2>/dev/null | xargs -n1 basename 2>/dev/null | sed 's/\.nix$//' | sort || true)
            PKGS="niri-unstable"
            for p in $REVPKGS; do
              [ "$p" = "niri-unstable" ] || PKGS="$PKGS $p"
            done
          fi
          # shellcheck disable=SC2206
          ARR=($PKGS)
          echo "TARGET_PKG=${ARR[0]}" >> "$GITHUB_ENV"
          echo "PACKAGE_LIST=$PKGS" >> "$GITHUB_ENV"
          echo "queue: $PKGS -> this run builds: ${ARR[0]}"

      - name: Needs-build gate (skip published revs, never recompile pointlessly)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The 3h schedule and push triggers default to the full queue, but a
          # published rev must NOT recompile: evaluate this target's outPath
          # and probe its narinfo on the rolling tag. Published (and not
          # force-rebuild) => skip build+publish for this target, STILL relay
          # the remainder. Missing => full honest compile below.
          # Single shared rolling tag; per-package manifests answer
          # "which files belong to which package" (see publish step).
          pkg="${{ env.TARGET_PKG }}"
          OUT=$(nix eval --raw ".#packages.x86_64-linux.$pkg.outPath" 2>/dev/null || true)
          # Presence probe the Nix-native way (`nix path-info --store`, per
          # manual): one parallel query, no curl loops, no rate-limit class.
          if [ "${{ github.event.inputs.force_rebuild }}" != "true" ] && [ -n "$OUT" ] \
            && nix path-info --store "https://github.com/${{ github.repository }}/releases/download/nixcache" "$OUT" >/dev/null 2>&1; then
            echo ">>> $pkg ($(basename "$OUT" | cut -d- -f1)) already published - skipping build, relaying remainder"
            echo "SKIP_TARGET=true" >> "$GITHUB_ENV"
          else
            echo ">>> $pkg needs build (missing from release or forced)"
            echo "SKIP_TARGET=false" >> "$GITHUB_ENV"
          fi

      - name: Resolve placeholder hashes (self-heal)
        if: env.SKIP_TARGET != 'true'
        run: |
          set -euo pipefail
          # A run must NEVER die on unresolved hashes: if update.yml has not
          # filled this rev's hashes yet (fakeHash), resolve them right here
          # with nix (same procedure as update.yml rust_rev_update).
          pkg="${{ env.TARGET_PKG }}"
          f="pkgs/$pkg.nix"
          if ! grep -q "fakeHash" "$f"; then
            echo ">>> $pkg hashes resolved, building"
            exit 0
          fi
          echo ">>> $pkg has placeholder hashes - resolving in place"
          O=$(grep -oP 'owner = "\K[^"]+' "$f" | head -1)
          R=$(grep -oP 'repo = "\K[^"]+' "$f" | head -1)
          REV=$(grep -oP 'rev = "\K[0-9a-f]{40}' "$f" | head -1)
          OUT=$(nix eval --impure --json --expr "builtins.fetchTree { type = \"github\"; owner = \"$O\"; repo = \"$R\"; rev = \"$REV\"; }" 2>/dev/null | jq -r 'if type == "object" then .outPath else . end' || true)
          if [ -n "$OUT" ] && [ "$OUT" != "null" ]; then
            SRCHASH=$(nix path-info --json --json-format 1 "$OUT" 2>/dev/null | jq -r '.[].narHash' || true)
            if [ -n "$SRCHASH" ] && [ "$SRCHASH" != "null" ]; then
              python3 - "$f" "$SRCHASH" <<'PYEOF'
          import re, sys
          path, srchash = sys.argv[1], sys.argv[2]
          text = open(path).read()
          text = re.sub(r'hash = "(?:lib\.fakeHash|sha256-[^"]*)"',
                        f'hash = "{srchash}"', text, count=1)
          open(path, "w").write(text)
          print("  src hash resolved")
          PYEOF
            fi
          fi
          sed -i 's|cargoHash = "sha256-[^"]*"|cargoHash = ""|; s|cargoHash = lib.fakeHash|cargoHash = ""|' "$f"
          # Same visibility+bound discipline as update.yml: stream via tee,
          # cap at 30 min, never hang the relay on a stalled vendor fetch.
          timeout 1800 nix build ".#packages.x86_64-linux.$pkg" --print-out-paths 2>&1 | tee /tmp/cargo-try.log || true
          GOT=$(grep -oP -m1 'got:\s*\Ksha256-[A-Za-z0-9+/=]+' /tmp/cargo-try.log || true)
          echo "--- vendor attempt tail:"
          tail -n 8 /tmp/cargo-try.log || true
          if [ -z "$GOT" ]; then
            echo "::error::$pkg hash self-heal failed - update.yml will retry next cycle"
            git checkout -- "$f"
            exit 1
          fi
          sed -i "s|cargoHash = \"\"|cargoHash = \"$GOT\"|" "$f"
          echo ">>> $pkg cargoHash resolved: ${GOT:0:20}..."
          git config user.name "opencode-agent[bot]"
          git config user.email "41898282+opencode-agent[bot]@users.noreply.github.com"
          git add "$f"
          git commit -m "chore: resolve $pkg rev-pinned hashes (nixcache self-heal)" || true
          git pull --rebase origin main 2>/dev/null || true
          git push origin main || echo "::warning::hash-commit push failed, build continues in-worktree"

      - name: Build target package
        if: env.SKIP_TARGET != 'true'
        run: |
          set -euo pipefail
          echo ">>> building ${{ env.TARGET_PKG }}"
          # NOTE: packages may have MULTIPLE outputs (out + man/doc). The full
          # path list travels via a GITHUB_ENV heredoc (plain echo corrupts
          # multiline values and fails the step). Downstream steps iterate lines.
          nix build ".#packages.x86_64-linux.${{ env.TARGET_PKG }}" --print-out-paths > /tmp/outpaths.txt
          cat /tmp/outpaths.txt
          {
            echo "TARGET_OUTS<<EOF"
            cat /tmp/outpaths.txt
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Sign closure (or warn-only without key)
        if: env.SKIP_TARGET != 'true'
        env:
          NIX_SIGNING_KEY: ${{ secrets.NIX_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NIX_SIGNING_KEY:-}" ]; then
            echo "::warning::NIX_SIGNING_KEY secret missing - build verified but publish will be SKIPPED. Owner: 'nix-store --generate-binary-cache-key nixcache ./cache-priv.pem ./nixcache.pub', commit nixcache.pub, store private half as NIX_SIGNING_KEY."
            echo "PUBLISH=false" >> "$GITHUB_ENV"
            exit 0
          fi
          printf '%s' "$NIX_SIGNING_KEY" > /tmp/cache-priv.pem
          chmod 600 /tmp/cache-priv.pem
          # TARGET_OUTS is multiline (one output path per line) - unquoted
          # expansion word-splits correctly; quoting would pass one broken arg.
          # shellcheck disable=SC2086
          nix store sign --recursive --key-file /tmp/cache-priv.pem $TARGET_OUTS \
            || nix-store --sign-paths -k /tmp/cache-priv.pem $TARGET_OUTS
          echo "PUBLISH=true" >> "$GITHUB_ENV"
          rm -f /tmp/cache-priv.pem

      - name: Assemble file-cache layout (dedup vs cache.nixos.org)
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          rm -rf nixcache-stage && mkdir -p nixcache-stage
          # shellcheck disable=SC2086
          nix path-info -r --json --json-format 1 $TARGET_OUTS \
            | jq -r 'keys[]' > /tmp/closure.txt
          echo "closure paths: $(wc -l < /tmp/closure.txt)"
          # Upstream dedup the Nix-native way: ONE parallel `nix path-info
          # --store` over the whole closure (mass-query batched where the
          # cache supports it) instead of sequential per-path curls.
          # Empty result = publish everything (safe side, skip logic dedups).
          nix path-info --store https://cache.nixos.org $(cat /tmp/closure.txt) 2>/dev/null > /tmp/upstream-have.txt || true
          grep -vxF -f /tmp/upstream-have.txt /tmp/closure.txt > /tmp/wanted.txt || cp /tmp/closure.txt /tmp/wanted.txt
          echo "publishing $(wc -l < /tmp/wanted.txt) of $(wc -l < /tmp/closure.txt) store paths"
          # shellcheck disable=SC2046
          nix copy --to "file://$PWD/nixcache-stage" $(cat /tmp/wanted.txt)
          # SHIP ALLOWLIST (2026-09-22): a file:// cache dir accumulates more
          # than shippable content across Nix versions (nar/, build-trace-v2/
          # memoization JSON, log/ build logs). Release assets are FLAT, so
          # only top-level *.narinfo + nar/* + nix-cache-info can ship.
          # Everything else is skipped LOUDLY (visible for future adaptation)
          # instead of failing the upload on a directory.
          mkdir -p nixcache-ship
          mv nixcache-stage/*.narinfo nixcache-ship/ 2>/dev/null || true
          mv nixcache-stage/nar nixcache-ship/nar 2>/dev/null || true
          [ -f nixcache-stage/nix-cache-info ] && mv nixcache-stage/nix-cache-info nixcache-ship/
          echo "skipped non-shippable layout:"
          ls -R nixcache-stage 2>/dev/null | head -20 || echo "  (none - clean layout)"
          rm -rf nixcache-stage && mv nixcache-ship nixcache-stage
          # Flatten for release assets (gh upload keeps basenames only):
          # move nar/* up, then rewrite narinfo URL fields to the flat names.
          # Hashes (FileHash/NarHash/Sig) are content-based, unaffected.
          mv nixcache-stage/nar/* nixcache-stage/ 2>/dev/null || true
          rmdir nixcache-stage/nar 2>/dev/null || true
          sed -i 's|^URL: nar/|URL: |' nixcache-stage/*.narinfo
          # self-verify: every narinfo we ship must carry our Sig
          missing=$(grep -L "^Sig: " nixcache-stage/*.narinfo 2>/dev/null || true)
          if [ -n "$missing" ]; then
            echo "::error::unsigned narinfos (signing did not stick): $missing"
            exit 1
          fi
          echo "all narinfos signed"
          ( cd nixcache-stage && ls -1 | sort > ../manifest-new.txt )
          wc -l manifest-new.txt

      - name: Publish to per-package rolling tag (upload + GC)
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view "nixcache" -R "$REPO" 2>/dev/null \
            || gh release create "nixcache" -R "$REPO" \
                 --title "Nix Binary Cache (rolling)" \
                 --notes "Nix binary cache (static file backend): add https://github.com/$REPO/releases/download/nixcache as substituter + nixcache.pub key. Rolling release holding current revs only; per-package manifests (manifest-<pkg>.txt) map files to packages." \
                 --prerelease
          retry_upload() {
            local file="$1" max=3
            for i in $(seq 1 $max); do
              if gh release upload "nixcache" -R "$REPO" "$file" --clobber 2>&1; then
                return 0
              fi
              sleep 10
            done
            echo "::error::upload failed: $file"
            return 1
          }
          existing=$(gh release view "nixcache" -R "$REPO" --json assets --jq '.assets[].name' || true)
          while read -r f; do
            [ -z "$f" ] && continue
            if [ "${{ github.event.inputs.force_rebuild }}" != "true" ] \
               && echo "$existing" | grep -qFx "$f"; then
              echo "  skip (already published): $f"
              continue
            fi
            retry_upload "nixcache-stage/$f"
          done < manifest-new.txt
          # One release, per-package manifests: this run writes
          # manifest-<pkg>.txt (exactly this rev's files); manifest.txt is
          # the union over all per-package manifests. GC keeps the union.
          cp manifest-new.txt "manifest-${{ env.TARGET_PKG }}.txt"
          retry_upload "manifest-${{ env.TARGET_PKG }}.txt"
          gh release download nixcache -R "$REPO" -p 'manifest-*.txt' -D /tmp/oldmanifests 2>/dev/null || true
          # Union with previously published per-package manifests (downloaded
          # above; may be absent on first run - the || true keeps that safe).
          # GC below keeps exactly this union: current revs live, old ones die.
          { cat /tmp/oldmanifests/manifest-*.txt 2>/dev/null || true; cat manifest-new.txt; } | sort -u > manifest.txt
          retry_upload "manifest.txt"
          echo ">>> GC: tag keeps ONLY current-rev files"
          RUN_START=$(date -u +%FT%TZ -d "@$(( $(date +%s) - 600 ))" 2>/dev/null || date -u -v-10M +%FT%TZ)
          gh release view "nixcache" -R "$REPO" --json assets \
            --jq '.assets[] | "\(.name) \(.createdAt)"' 2>/dev/null | while read -r asset created; do
            [ -z "$asset" ] && continue
            [[ "$asset" == manifest*.txt ]] && continue
            if ! grep -qFx "$asset" manifest.txt && [[ "$created" < "$RUN_START" ]]; then
              echo "  deleting stale: $asset ($created)"
              gh release delete-asset "nixcache" "$asset" --repo "$REPO" -y 2>/dev/null || true
            fi
          done

      - name: Relay to next package in queue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          read -r -a PKGS <<< "${{ env.PACKAGE_LIST }}"
          REMAINING="${PKGS[@]:1}"
          if [ -n "$REMAINING" ]; then
            echo "relaying to: $REMAINING (this package done or failed, queue continues)"
            # Same transient-5xx discipline as the dispatch head.
            for i in 1 2 3 4; do
              if gh workflow run "nixcache.yml" \
                --ref "${GITHUB_REF_NAME}" \
                --repo "${{ github.repository }}" \
                -f packages="$REMAINING" \
                -f force_rebuild="${{ github.event.inputs.force_rebuild || 'false' }}"; then
                break
              fi
              echo "::warning::relay attempt $i/4 failed - backing off"
              sleep $((30 * i))
              [ "$i" -eq 4 ] && echo "::warning::relay to [$REMAINING] failed - next scheduled nixcache run picks up the remainder"
            done
          else
            echo "queue finished."
          fi
